on:
  pull_request:
  push:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
    - uses: sbt/setup-sbt@v1
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17
    - run: sbt -v --server compile
